# Single root pyproject for the whole backend (INF-10, build-system.md). web and
# worker share this environment and lockfile. `package-mode = false`: this is an
# application run from source, not a published package — so `version` here is an
# inert placeholder; the real product version is baked from the git tag at build
# (ci.md, 1.T4) and exposed on /api/health.

[tool.poetry]
package-mode = false
version = "0.0.0"   # inert placeholder — see note above (git describe is the source of truth)

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pydantic = ">=2.7,<3.0"
pyyaml = ">=6.0,<7.0"
bcrypt = ">=4.1,<5.0"
pyjwt = ">=2.9,<3.0"
markdown-it-py = "^4.2.0"
nh3 = "^0.3.6"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"
# FastAPI TestClient transport. `httpx2`, not `httpx`: since Starlette 1.3 the test client
# imports `httpx2` and only falls back to `httpx` with a deprecation warning, and `httpx2` is
# where the upstream line is maintained now. Nothing here imports it directly — Starlette
# aliases it internally — so the two are interchangeable for us (#36).
httpx2 = ">=2.0"
types-pyyaml = ">=6.0"
# Runs the suite across cores (`-n auto`, see addopts below). The test suite is the CI's
# entire critical path, so this is the one dependency here that buys wall-clock time.
pytest-xdist = "^3.8.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# bcrypt ships no type information in some releases; the calls are tiny and typed
# at our call sites, so silence the missing-stub error rather than vendoring stubs.
module = ["bcrypt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto`: one worker per core. The suite was the CI's whole critical path (247 s of a
# 280 s job, with ruff+mypy costing 12 s between them) and it is dominated by bcrypt, which
# is slow *by design* — nearly every test logs a user in, and each hash costs ~210 ms.
# Nothing had to change to parallelise it: every worker is its own process, so the
# module-level engine and the in-memory SQLite are already per-worker, the mock HTTP
# servers bind port 0, and no fixture is session- or module-scoped.
# Use `-n0` when debugging a single failure — with workers the output interleaves.
addopts = "-q -n auto"
markers = [
    "real_direct_mail: opt out of the stubbed direct mail (passwords and account notices) (see tests/conftest.py)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
