# Single root pyproject for the whole backend (INF-10, build-system.md). web and
# worker share this environment and lockfile. `package-mode = false`: this is an
# application run from source, not a published package — so `version` here is an
# inert placeholder; the real product version is baked from the git tag at build
# (ci.md, 1.T4) and exposed on /api/health.

[tool.poetry]
package-mode = false
version = "0.0.0"   # inert placeholder — see note above (git describe is the source of truth)

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pydantic = ">=2.7,<3.0"
pyyaml = ">=6.0,<7.0"
bcrypt = ">=4.1,<5.0"
pyjwt = ">=2.9,<3.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pytest = ">=8.0"
httpx = ">=0.27"   # FastAPI TestClient transport
types-pyyaml = ">=6.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# bcrypt ships no type information in some releases; the calls are tiny and typed
# at our call sites, so silence the missing-stub error rather than vendoring stubs.
module = ["bcrypt"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
