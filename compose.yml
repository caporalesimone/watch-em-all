# Release compose (the deploy kit) — pulls published images from GHCR, no build.
# This is one of the two files an end user needs (the other is .env.example). The
# kit lives in the repo and is fetched at the release tag — it is NOT attached to
# the GitHub release (INF-17, deployment.md):
#
#   VERSION=x.y.z
#   curl -LO https://raw.githubusercontent.com/caporalesimone/watch-em-all/$VERSION/compose.yml
#   curl -LO https://raw.githubusercontent.com/caporalesimone/watch-em-all/$VERSION/.env.example
#   cp .env.example .env            # then fill in the values (WEA_VERSION=$VERSION)
#   docker compose pull && docker compose up -d
#
# web and worker are ONE image (watch-em-all), two roles selected by `command`;
# ops is a separate image (postgres:16 + scripts). No `version:` field (deprecated
# in Compose v2); images pinned via WEA_VERSION in .env (never `latest`, INF-1);
# log rotation everywhere (INF-2).

# Fixed Compose project name → predictable, and distinct from the development
# stack (compose-dev.yml uses `watch-em-all-dev`), so their volumes never clash.
name: watch-em-all

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # The database lives in a Docker-managed named volume (above) — recommended.
    # To keep it in a LOCAL folder instead, replace the line above with a bind
    # mount AND remove the top-level `volumes:` block at the end of this file:
    #   volumes: ["./pgdata:/var/lib/postgresql/data"]
    # Use a native Linux path (not a Windows/WSL mount like /mnt/c): Postgres on a
    # 9p mount can hit permission/performance issues. The folder is created on first run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ghcr.io/caporalesimone/watch-em-all:${WEA_VERSION}
    command: ["web"]
    ports: ["8080:8080"]
    # config.yaml default is baked into the image; to override it locally:
    # volumes: ["./config.yaml:/app/config.yaml:ro"]
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # curl ships in the app image (packages/app/Dockerfile); -f makes non-2xx
      # exit non-zero. Same command as the dev compose — one healthcheck everywhere.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  worker:
    image: ghcr.io/caporalesimone/watch-em-all:${WEA_VERSION}
    command: ["worker"]
    # volumes: ["./config.yaml:/app/config.yaml:ro"]   # same as web, optional
    env_file: [.env]
    tmpfs:
      - /tmp                          # heartbeat is ephemeral runtime state: keep it in
                                      # RAM so the per-tick write never hits the disk
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # heartbeat: the worker touches this file every tick (CRON-R7); unhealthy if stale
      test: ["CMD-SHELL", "test $$(($$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat))) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  ops:
    image: ghcr.io/caporalesimone/watch-em-all-ops:${WEA_VERSION}
    profiles: [ops]                      # ephemeral: docker compose run --rm ops <script>
    env_file: [.env]
    volumes:
      - ./backups:/backups               # archives destination
      - ./.env:/host/.env:ro             # included in the backup
      # - ./config.yaml:/host/config.yaml:ro   # if a local override exists, back it up too
    depends_on:
      db: { condition: service_healthy }

  adminer:
    image: adminer:4
    ports: ["8081:8080"]
    profiles: [dev]                      # browser DB inspection, dev only
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
