name: Cleanup dev images

# When a PR closes (merged OR abandoned), delete its dev-<branch> tag from GHCR so
# the packages don't accumulate stale dev images (ci.md: dev-* are ephemeral).
# Only the branch's own dev tag is removed — release tags (x.y.z) are never touched.
#
# Runs from the base branch (main) on the closed event, so it takes effect for PRs
# closed after this workflow lands. Uses the Actions GITHUB_TOKEN (packages: write);
# if GitHub refuses to delete user-owned package versions, switch `token` to a
# classic PAT secret with the `delete:packages` scope.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Compute the dev tag for this branch
        id: meta
        run: |
          slug="$(printf '%s' '${{ github.event.pull_request.head.ref }}' | sed 's#[^A-Za-z0-9_.-]#-#g')"
          echo "tag=dev-$slug" >> "$GITHUB_OUTPUT"
          echo "Will delete tag: dev-$slug"
      - name: Delete the dev tag from the app and ops packages
        # GitHub forbids deleting a package's LAST tagged version (you'd have to
        # delete the whole package). That only happens transiently — before any
        # release tag exists and the package holds a single dev tag. Tolerate it so
        # closing a PR never fails; it self-resolves once a release tag (x.y.z) is a
        # permanent second version. In steady state deletion always succeeds.
        continue-on-error: true
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: watch-em-all,watch-em-all-ops
          delete-tags: ${{ steps.meta.outputs.tag }}   # only this tag; release tags untouched
          delete-untagged: true                        # also remove the orphan manifest left
                                                        # after unlinking the tag (otherwise GHCR
                                                        # keeps a phantom untagged sha version).
                                                        # Safe here: images are single-arch.
