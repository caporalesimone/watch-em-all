name: CI

# Phase 0 CI (0.T6): build the three images on every PR and guard the CHANGELOG.
# Linters, typecheck and tests arrive with the first code (1.T1, ci.md). Publishing
# the dev-<branch> images to GHCR is layered on in 0.T7.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changelog-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md must be updated in every PR (INF-19)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Every PR must add a CHANGELOG.md entry (one PR = one version, INF-19)."
            exit 1
          fi

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [web, worker, ops]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.image }}/Dockerfile
          push: false
