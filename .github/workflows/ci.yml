name: CI

# CI: on every PR, guard the CHANGELOG, run the backend checks (1.T1: ruff, mypy,
# pytest) and frontend checks (prettier, svelte-check, build), then build the two
# images, publishing them to GHCR as dev-<branch> so a branch can be tried before
# merge (ci.md). workflow_dispatch covers branches without an open PR.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build and publish dev images for"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  changelog-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: CHANGELOG.md must be updated in every PR (INF-19)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if git diff --name-only "$base" "$head" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
          else
            echo "::error::Every PR must add a CHANGELOG.md entry (one PR = one version, INF-19)."
            exit 1
          fi

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install
      - name: Ruff lint
        run: poetry run ruff check .
      - name: Ruff format check
        run: poetry run ruff format --check .
      - name: Mypy (strict)
        run: poetry run mypy
      - name: Pytest
        run: poetry run pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: i18n consistency (English reference, 4.B11)
        run: npm run i18n:check
      - name: Prettier check
        run: npm run format:check
      - name: Svelte check
        run: npm run check
      - name: Build
        run: npm run build

  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: watch-em-all, dockerfile: packages/app/Dockerfile }      # web + worker roles
          - { image: watch-em-all-ops, dockerfile: packages/ops/Dockerfile }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags so `git describe` (in the image build) bakes the real version (1.T4)
      - uses: docker/setup-buildx-action@v4
      - name: Compute dev tag and owner
        id: meta
        run: |
          ref='${{ github.event.pull_request.head.ref || inputs.ref || github.ref_name }}'
          slug="$(printf '%s' "$ref" | sed 's#[^A-Za-z0-9_.-]#-#g')"
          echo "tag=dev-$slug" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} as dev-<branch>
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false   # no attestation manifest -> no "unknown/unknown" entry in GHCR
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
