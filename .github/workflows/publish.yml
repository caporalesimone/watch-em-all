name: Publish

# Phase 0 (0.T9): on an x.y.z tag — created by the owner by hand whenever a release
# is wanted — build and push the two versioned images to GHCR. Tags are plain SemVer,
# no `v` prefix; there is no auto-tag workflow.
#
# The deploy kit (compose.yml + .env.example) is NOT attached as a release asset: it
# lives in the repo and users fetch it from there (README install / deployment.md).
# So this workflow only builds the images; the GitHub release itself, with its notes,
# is created by the owner (GitHub UI or CLI) — no assets, so GitHub's immutable
# releases impose no special handling here.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: watch-em-all, dockerfile: packages/app/Dockerfile }      # web + worker roles
          - { image: watch-em-all-ops, dockerfile: packages/ops/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Compute owner (lowercase for GHCR)
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} ${{ github.ref_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false   # no attestation manifest -> no "unknown/unknown" entry in GHCR
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}
