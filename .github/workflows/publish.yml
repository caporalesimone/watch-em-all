name: Publish

# Phase 0 (0.T9): on an x.y.z tag — created by the owner by hand whenever a release
# is wanted — build and push the two versioned images to GHCR and stage the GitHub
# release with the deploy kit attached: compose.yml + .env.example, the only two
# files an end user needs (deployment.md, INF-17). Tagging is manual; there is no
# auto-tag workflow. Tags are plain SemVer, no `v` prefix.
#
# GitHub immutable releases (the default) freeze a release's assets at publish time,
# so the kit MUST be attached BEFORE publishing — and drafts don't trigger workflows.
# So the flow is: push the tag from the CLI -> this workflow stages a DRAFT release
# with the kit attached (drafts are mutable) and STOPS -> the owner reviews, writes
# the notes and clicks Publish in the UI. DO NOT publish a release by hand from the
# UI: it would lock an empty (kit-less) immutable release and burn that version (the
# tag becomes permanently reserved). The release job below guards against that case.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: watch-em-all, dockerfile: packages/app/Dockerfile }      # web + worker roles
          - { image: watch-em-all-ops, dockerfile: packages/ops/Dockerfile }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Compute owner (lowercase for GHCR)
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} ${{ github.ref_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false   # no attestation manifest -> no "unknown/unknown" entry in GHCR
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage the release draft with the deploy kit (immutable-safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # Immutable releases freeze assets at publish time, so the kit must be attached
          # while the release is still a DRAFT (mutable). Stage the draft and stop — the
          # owner publishes it from the UI.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$state" = "false" ]; then
              # A PUBLISHED release already exists for this tag -> someone released by hand
              # from the UI. It is immutable: the kit can no longer be attached and this
              # version is now permanently reserved. Don't let it poison /releases/latest
              # (best-effort flip to pre-release) and fail loudly with what to do next.
              gh release edit "$TAG" --prerelease || true
              echo "::error::Release $TAG is already PUBLISHED (released by hand from the UI?). Immutable releases can't receive the deploy kit afterwards and this version is now permanently reserved. Delete this release and re-release with the NEXT patch version via a CLI tag push (git tag x.y.z && git push origin x.y.z)."
              exit 1
            fi
            # Our own draft from a previous run: refresh the kit (drafts are mutable).
            gh release upload "$TAG" deploy/compose.yml '.env.example' --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --notes "Deploy kit attached: compose.yml + .env.example (see docs/infrastructure/deployment.md). Set WEA_VERSION=${TAG} in your .env. Edit these notes, then publish." \
              deploy/compose.yml '.env.example'
          fi
          echo "Draft release $TAG staged with the deploy kit — review, write the notes and Publish it from the GitHub UI."
