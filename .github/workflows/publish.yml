name: Publish

# Phase 0 (0.T9): on an x.y.z tag — created by the owner by hand whenever a release
# is wanted — build and push the two versioned images to GHCR. Tags are plain SemVer,
# no `v` prefix; there is no auto-tag workflow.
#
# Phase 1 (1.T4): the product version's single source of truth is the git tag. The
# image build derives it with `git describe` (so checkout needs the full history +
# tags: fetch-depth 0), and a version-guard verifies the tag matches the top
# CHANGELOG entry (the CHANGELOG is verified, not the source).
#
# The deploy kit (compose.yml + .env.example) is NOT attached as a release asset: it
# lives in the repo and users fetch it from there (README install / deployment.md).
# So this workflow only builds the images; the GitHub release itself, with its notes,
# is created by the owner (GitHub UI or CLI).

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the top CHANGELOG entry (1.T4, INF-19)
        run: |
          top="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          echo "tag=${GITHUB_REF_NAME}  changelog-top=${top:-<none>}"
          if [ -z "$top" ]; then
            echo "::error::Could not parse the top version from CHANGELOG.md."
            exit 1
          fi
          if [ "$top" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the top CHANGELOG entry ${top}. The CHANGELOG is verified, not the source (ci.md) — finalize CHANGELOG.md before tagging."
            exit 1
          fi
          echo "Tag matches the top CHANGELOG entry."

  i18n-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: i18n consistency (English reference, 4.B11)
        run: node src/frontend/scripts/i18n-check.mjs   # zero runtime deps — no npm install needed

  images:
    needs: [version-guard, i18n-guard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: watch-em-all, dockerfile: packages/app/Dockerfile }      # web + worker roles
          - { image: watch-em-all-ops, dockerfile: packages/ops/Dockerfile }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags so `git describe` (in the image build) yields the real version
      - uses: docker/setup-buildx-action@v4
      - name: Compute owner (lowercase for GHCR)
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.image }} ${{ github.ref_name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false   # no attestation manifest -> no "unknown/unknown" entry in GHCR
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ matrix.image }}:${{ github.ref_name }}
