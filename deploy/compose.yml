# Release compose (the deploy kit) — pulls published images from GHCR, no build.
# This is one of the two files an end user needs (the other is .env.example):
# attached to every GitHub release by the publish workflow (0.T9, deployment.md).
#
#   curl -LO .../releases/latest/download/compose.yml
#   curl -LO .../releases/latest/download/.env.example
#   cp .env.example .env            # then fill in the values
#   docker compose pull && docker compose up -d
#
# web and worker are ONE image (watch-em-all), two roles selected by `command`;
# ops is a separate image (postgres:16 + scripts). No `version:` field (deprecated
# in Compose v2); images pinned via WEA_VERSION in .env (never `latest`, INF-1);
# log rotation everywhere (INF-2).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: ghcr.io/caporalesimone/watch-em-all:${WEA_VERSION}
    command: ["web"]
    ports: ["8080:8080"]
    # config.yaml default is baked into the image; to override it locally:
    # volumes: ["./config.yaml:/app/config.yaml:ro"]
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # Phase 0 ships the stub image (stdlib only, no curl): probe with Python.
      # Switches to `curl -fsS http://localhost:8080/api/health` with the real
      # image (1.B2), as documented in deployment.md.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  worker:
    image: ghcr.io/caporalesimone/watch-em-all:${WEA_VERSION}
    command: ["worker"]
    # volumes: ["./config.yaml:/app/config.yaml:ro"]   # same as web, optional
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # heartbeat: the worker touches this file every tick (CRON-R7); unhealthy if stale
      test: ["CMD-SHELL", "test $$(($$(date +%s) - $$(stat -c %Y /tmp/worker-heartbeat))) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  ops:
    image: ghcr.io/caporalesimone/watch-em-all-ops:${WEA_VERSION}
    profiles: [ops]                      # ephemeral: docker compose run --rm ops <script>
    env_file: [.env]
    volumes:
      - ./backups:/backups               # archives destination
      - ./.env:/host/.env:ro             # included in the backup
      # - ./config.yaml:/host/config.yaml:ro   # if a local override exists, back it up too
    depends_on:
      db: { condition: service_healthy }

  adminer:
    image: adminer:4
    ports: ["8081:8080"]
    profiles: [dev]                      # browser DB inspection, dev only
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
